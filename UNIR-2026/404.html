<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirigiendo...</title>
    <script>
        // Captura la URL original ingresada
        var currentUrl = window.location.href;
        
        // Si la URL contiene espacios o el parámetro folio incompleto
        if (currentUrl.indexOf(' ') !== -1 || currentUrl.indexOf('folio=') !== -1) {
            // Reemplaza todos los espacios por %20 para hacerla una URL válida
            var cleanUrl = currentUrl.replace(/ /g, '%20');
            window.location.replace(cleanUrl);
        }
    </script>
</head>
<body>
    <p>Cargando validación de constancia...</p>
</body>
</html>
